<mat-toolbar color="primary" class="navbar">
    <a mat-button class="brand-logo" routerLink="/">Mallikarjuna</a>
    <span class="spacer"></span>
    <button mat-icon-button [matMenuTriggerFor]="themeMenu">
        <mat-icon>{{
            currentTheme === 'light' ? 'light_mode' :
            currentTheme === 'dark' ? 'dark_mode' :
            currentTheme === 'enterprise' ? 'business' :
            currentTheme === 'developer' ? 'code' : 'layers'
        }}</mat-icon>
    </button>
    <mat-menu #themeMenu="matMenu">
        <button mat-menu-item *ngFor="let theme of themes" (click)="setTheme(theme.id)">
            <mat-icon>{{ theme.icon }}</mat-icon>
            <span>{{ theme.label }}</span>
        </button>
    </mat-menu>
    <div class="desktop-menu">
        <a mat-button href="#home">Home</a>
        <a mat-button href="#skills">Skills</a>
        <a mat-button href="#projects">Projects</a>
        <a mat-button routerLink="/custom-page">Custom page</a>
        <!-- <a mat-button routerLink="/add-content">Add</a> -->
        <a mat-button routerLink="/contact">Contact</a>
        <a mat-button routerLink="/mini-projects" >Mini Projects</a>
    </div>
    <button mat-icon-button class="mobile-menu-btn" [matMenuTriggerFor]="mobileMenu">
        <mat-icon>menu</mat-icon>
    </button>
    <mat-menu #mobileMenu="matMenu">
        <a mat-menu-item href="#home">Home</a>
        <a mat-menu-item href="#skills">Skills</a>
        <a mat-menu-item href="#projects">Projects</a>
        <a mat-menu-item routerLink="/custom-page">Custom Page</a>
        <!-- <a mat-menu-item routerLink="/add-content">Add</a> -->
        <a mat-menu-item routerLink="/contact">Contact</a>
        <a mat-menu-item routerLink="/mini-projects" class="nav-item">Mini Projects</a>
    </mat-menu>

</mat-toolbar>
