<mat-toolbar color="primary" class="navbar">
    <a mat-button class="brand-logo" routerLink="/">Mallikarjuna</a>
    <span class="spacer"></span>
    <button mat-icon-button (click)="toggleTheme()">
        <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
    <div class="desktop-menu">
        <a mat-button href="#home">Home</a>
        <a mat-button href="#skills">Skills</a>
        <a mat-button href="#projects">Projects</a>
        <a mat-button routerLink="/contact">Contact</a>
        <a mat-button routerLink="/mini-projects" >
            Mini Projects
        </a>
    </div>
    <button mat-icon-button class="mobile-menu-btn" [matMenuTriggerFor]="mobileMenu">
        <mat-icon>menu</mat-icon>
    </button>
    <mat-menu #mobileMenu="matMenu">
        <a mat-menu-item href="#home">Home</a>
        <a mat-menu-item href="#skills">Skills</a>
        <a mat-menu-item href="#projects">Projects</a>
        <a mat-menu-item routerLink="/contact">Contact</a>

        <a mat-menu-item routerLink="/mini-projects" class="nav-item">
            Mini Projects
        </a>
    </mat-menu>

</mat-toolbar>
