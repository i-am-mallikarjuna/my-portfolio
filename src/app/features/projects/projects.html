<div class="projects-container">
    <h2 class="section-title">Projects</h2>

    <div class="projects-grid">
        <mat-card class="project-card" *ngFor="let project of projects">
            <mat-card-header>
                <mat-card-title class="project-title">{{ project.title }}</mat-card-title>
                <mat-card-subtitle class="project-role">
                    <strong>{{ project.role }}</strong> | {{ project.company }}
                </mat-card-subtitle>
            </mat-card-header>

            <mat-card-content class="project-content">
                <p>{{ project.description }}</p>

                <div class="tech-stack">
                    <mat-chip-set>
                        <mat-chip *ngFor="let tech of project.techStack" class="tech-chip">
                            {{ tech }}
                        </mat-chip>
                    </mat-chip-set>
                </div>
            </mat-card-content>

            <mat-card-actions class="project-actions">
                <button mat-button color="primary" (click)="openCaseStudy(project)">View Details</button>
            </mat-card-actions>
        </mat-card>
    </div>
</div>
