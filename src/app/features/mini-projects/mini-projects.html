<div class="lab-container">
    <h2 class="section-title">The Lab</h2>
    <p class="lab-subtitle">A collection of experimental projects, curiosities, and creative coding snippets.</p>

    <div class="lab-grid">
        <mat-card class="lab-card" *ngFor="let project of projects">
            <mat-card-header>
                <mat-card-title>{{ project.title }}</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <p>{{ project.description }}</p>
            </mat-card-content>
            <mat-card-actions>
                <a mat-button color="primary" [href]="project.path" target="_blank">Launch Experiment</a>
            </mat-card-actions>
        </mat-card>
    </div>
</div>
